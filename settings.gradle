pluginManagement {
    repositories {
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // Aliuhook (Xposed-совместимые хуки поверх LSPlant) для движка плагинов
        maven { url "https://maven.aliucord.com/releases" }
    }
}

rootProject.name = "exteraless"
include ':TMessagesProj'

gradle.ext.androidxMediaModulePrefix = 'TMessagesProj_Modules:media3:media-'
apply from: file("TMessagesProj_Modules/media/core_settings.gradle")
project(':TMessagesProj_Modules:media3:media-lib-common-ktx').projectDir = file("TMessagesProj_Modules/media3/common-ktx")
