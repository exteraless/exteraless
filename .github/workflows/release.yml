name: Release Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the GitHub pre-release and post the APK to Telegram'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Gradle Build
    if: ${{ github.repository == 'exteraless/exteraless' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      build_timestamp: ${{ steps.release_build_step.outputs.build_timestamp }}
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_HARDLINK: "true"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "2G"
      NATIVE_TARGET: "universal"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set up Python for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Point Chaquopy at that Python
        run: echo "CHAQUOPY_BUILD_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
      - name: Set up Ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: android-ndk
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Set up Android SDK Tools
        uses: android-actions/setup-android@v4
        with:
          packages: "build-tools;36.0.0 ndk;27.2.12479018 platforms;android-37.0"
      - name: Install Native Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes nasm
      - name: Configure Android SDK Path
        run: |
          echo "sdk.dir=${ANDROID_HOME}" >> local.properties
      - name: Modify Gradle JVM Args
        run: |
          MEMORY_KB=$(awk '/MemTotal/ {print $2}' /proc/meminfo)
          MEMORY_GB=$((MEMORY_KB / 1024 / 1024))
          echo "Detected memory size: ${MEMORY_GB}GB"
          if [ "$MEMORY_GB" -ge 12 ]; then
            sed -i '/^org\.gradle\.jvmargs=/d' gradle.properties
            echo "org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=2G -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> gradle.properties
          fi
      - name: Restore signing key
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          if [ -n "$RELEASE_KEYSTORE" ]; then
            printf '%s' "$RELEASE_KEYSTORE" | base64 --decode > TMessagesProj/release.keystore
            echo "signing key restored"
          else
            echo "RELEASE_KEYSTORE не задан — сборка подпишется отладочным ключом"
          fi
      - name: Release Build
        id: release_build_step
        env:
          COMMIT_ID: ${{ github.event.head_commit.id || github.sha }}
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
          REQUIRE_RELEASE_SIGNING: ${{ (github.event_name != 'workflow_dispatch' || inputs.publish) && !contains(github.event.head_commit.message, '[skip publish]') }}
        run: |
          BUILD_TIMESTAMP=$(date +%s)
          export BUILD_TIMESTAMP
          echo "build_timestamp=$BUILD_TIMESTAMP" >> "$GITHUB_OUTPUT"
          ./gradlew --no-daemon --stacktrace :TMessagesProj:assembleRelease
      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: Release
          path: |
            TMessagesProj/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish release
    needs: build
    if: ${{ github.repository == 'exteraless/exteraless' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.publish) && !contains(github.event.head_commit.message, '[skip publish]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download release artifact
        uses: actions/download-artifact@v7
        with:
          name: Release
          path: TMessagesProj/build/outputs/apk/release
      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT=$(echo "$GITHUB_SHA" | cut -c1-7)
          TAG="ci-$SHORT"
          NOTES=$(jq -r '(.commits // []) | map("• " + (.message | split("\n")[0])) | join("\n")' "$GITHUB_EVENT_PATH")
          if [ -z "$NOTES" ]; then
            NOTES="CI build $SHORT"
          fi
          gh release create "$TAG" TMessagesProj/build/outputs/apk/release/*.apk \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "exteraless CI $SHORT" --notes "$NOTES"
          gh release list --limit 100 --json tagName,isPrerelease,createdAt \
            -q '[.[] | select(.isPrerelease and (.tagName | startswith("ci-")))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
            while read -r old; do
              gh release delete "$old" --yes --cleanup-tag
            done
      - name: Send APK to Telegram
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TG_BOT_TOKEN" ] || [ -z "$TG_API_ID" ] || [ -z "$TG_API_HASH" ] || [ -z "$TG_CHAT_ID" ]; then
            echo "секреты Telegram не заданы — отправка пропущена"
            exit 0
          fi
          python3 -m pip install --quiet kurigram tgcrypto
          python3 .github/scripts/send_apk.py
