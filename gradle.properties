# org.gradle.parallel=true
#Sat Mar 12 05:53:50 MSK 2016
APP_VERSION_CODE=7038
APP_VERSION_NAME=12.10.1
APP_PACKAGE=com.exteraless.app
# Отладочный ключ Nothing Glyph SDK; боевой подставляется через GLYPH_API_KEY при сборке.
GLYPH_API_KEY=test
android.useAndroidX=true
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false
org.gradle.daemon.idletimeout=600000
org.gradle.jvmargs=-Xmx3g -XX:+UseG1GC -XX:MaxHeapFreeRatio=40 -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1g -XX:+UseG1GC -XX:MaxHeapFreeRatio=40
org.gradle.caching=true
org.gradle.vfs.watch=true
org.gradle.parallel=true
org.gradle.tooling.parallel=true
# Configuration cache is incompatible with the Chaquopy plugin (plugins engine):
# it starts external Python processes at configuration time.
org.gradle.configuration-cache=false
